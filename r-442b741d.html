<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spreadsheet — ÆTHER</title>
  <!-- Unlisted page: not linked anywhere, not in sitemap.xml, kept out of search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />

  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/substance.css" />
  <style>
    main { max-width: 1100px; }
    .product-badge {
      display: inline-block;
      font-family: 'GeometosRounded', sans-serif;
      font-size: 0.52rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--gold);
      padding: 0.35rem 0.9rem;
      margin-bottom: 1.5rem;
    }
    .sheet-frame {
      border: 1px solid var(--gold);
      background: #ffffff;
      margin-top: 2rem;
    }
    .sheet-frame iframe {
      display: block;
      width: 100%;
      height: 75vh;
      min-height: 480px;
      border: 0;
    }
    .sheet-open {
      display: inline-block;
      margin-top: 1.25rem;
      font-family: 'GeometosRounded', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 0.6rem 1.2rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .sheet-open:hover {
      border-color: var(--gold-light);
      color: var(--gold-light);
    }
  </style>
  <!-- Enhancements: living bg, reading progress, sticky header, scroll reveal -->
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="assets/enhance.css" />
  <script defer src="assets/enhance.js"></script>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">← Home</a>
    <a href="index.html" class="header-logo"><img src="assets/logo-header.png" alt="ÆTHER" /></a>
  </header>

  <main>
    <div class="hero">
      <div class="product-badge">ÆTHER Resource</div>
      <h1 class="title">Spreadsheet</h1>
    </div>

    <div class="rule"></div>

    <div class="sheet-frame">
      <iframe src="https://docs.google.com/spreadsheets/d/1mUe8Lr_DLo6aVajzHyJcxXoYgxqe85YMdN_F00Kau20/preview" title="Spreadsheet" loading="lazy"></iframe>
    </div>
    <a class="sheet-open" href="https://docs.google.com/spreadsheets/d/1mUe8Lr_DLo6aVajzHyJcxXoYgxqe85YMdN_F00Kau20/edit?usp=sharing" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-up-right-from-square"></i>&nbsp; Open in Google Sheets</a>
  </main>

  <footer>
    <img class="footer-logo" src="assets/logo-header.png" alt="ÆTHER" /><span>Ann Arbor</span>
  </footer>
</body>
</html>
