<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ÆTHER</title>
  <!-- Unlisted page: not linked anywhere, not in sitemap.xml, kept out of search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />

  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="assets/substance.css" />
  <style>
    main { max-width: 1100px; }
    .product-badge {
      display: inline-block;
      font-family: 'GeometosRounded', sans-serif;
      font-size: 0.52rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--gold);
      padding: 0.35rem 0.9rem;
      margin-bottom: 1.5rem;
    }

    /* Sheet rendered as a site-styled table (data fetched live from Google Sheets via CSV export; gviz drops mixed-type cells) */
    .sheet-wrap {
      margin-top: 2rem;
      border: 1px solid rgba(154, 125, 46, 0.45);
      background: #0d0d0d;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .sheet-status {
      padding: 2rem 1.25rem;
      font-size: 0.68rem;
      line-height: 1.85;
      color: #888880;
      text-align: center;
    }
    table.sheet {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.72rem;
      line-height: 1.6;
      color: #cccccc;
    }
    table.sheet th {
      font-family: 'GeometosRounded', sans-serif;
      font-size: 0.56rem;
      font-weight: normal;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-light);
      background: #111109;
      text-align: left;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--gold);
      position: sticky;
      top: 0;
    }
    table.sheet td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e1e1a;
      vertical-align: top;
      overflow-wrap: anywhere;
      min-width: 6rem;
    }
    table.sheet tbody tr:nth-child(even) td { background: #111110; }
    table.sheet tbody tr:hover td { background: #16140d; }
    table.sheet a, .sheet-cards a { color: var(--gold-light); overflow-wrap: anywhere; }

    /* Phones: each row becomes a card so nothing runs off the screen */
    .sheet-cards { display: none; }
    @media (max-width: 700px) {
      .sheet-wrap { border: 0; background: none; overflow: visible; }
      table.sheet { display: none; }
      .sheet-cards { display: block; }
      .sheet-card {
        border: 1px solid rgba(154, 125, 46, 0.35);
        border-left: 2px solid var(--gold);
        background: #0f0f0e;
        padding: 0.9rem 1rem;
        margin-bottom: 0.9rem;
      }
      .sheet-field + .sheet-field { margin-top: 0.65rem; }
      .sheet-label {
        font-family: 'GeometosRounded', sans-serif;
        font-size: 0.5rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold-light);
        margin-bottom: 0.2rem;
      }
      .sheet-value {
        font-size: 0.78rem;
        line-height: 1.6;
        color: #cccccc;
        overflow-wrap: anywhere;
      }
    }

    .sheet-open {
      display: inline-block;
      margin-top: 1.25rem;
      font-family: 'GeometosRounded', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 0.6rem 1.2rem;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s;
    }
    .sheet-open:hover {
      border-color: var(--gold-light);
      color: var(--gold-light);
    }
  </style>
  <!-- Enhancements: living bg, reading progress, sticky header, scroll reveal -->
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="assets/enhance.css" />
  <script defer src="assets/enhance.js"></script>
</head>
<body>
  <header>
    <a href="index.html" class="back-btn">← Home</a>
    <a href="index.html" class="header-logo"><img src="assets/logo-header.png" alt="ÆTHER" /></a>
  </header>

  <main>
    <div class="hero">
      <div class="product-badge">ÆTHER Resource</div>
    </div>

    <div class="rule"></div>

    <div class="sheet-wrap" id="sheet">
      <p class="sheet-status">Loading…</p>
    </div>
    <a class="sheet-open" href="https://docs.google.com/spreadsheets/d/1mUe8Lr_DLo6aVajzHyJcxXoYgxqe85YMdN_F00Kau20/edit?usp=sharing" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-up-right-from-square"></i>&nbsp; Open in Google Sheets</a>
  </main>

  <footer>
    <img class="footer-logo" src="assets/logo-header.png" alt="ÆTHER" /><span>Ann Arbor</span>
  </footer>

  <script>
    (function () {
      var SHEET_ID = '1mUe8Lr_DLo6aVajzHyJcxXoYgxqe85YMdN_F00Kau20';
      var CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv';
      var box = document.getElementById('sheet');

      // RFC 4180 CSV parser (handles quoted commas, quotes and newlines)
      function parseCSV(text) {
        var rows = [], row = [], field = '', q = false;
        for (var i = 0; i < text.length; i++) {
          var c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') { field += '"'; i++; } else { q = false; }
            } else { field += c; }
          } else if (c === '"') { q = true; }
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n' || c === '\r') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(field); rows.push(row); row = []; field = '';
          } else { field += c; }
        }
        if (field !== '' || row.length) { row.push(field); rows.push(row); }
        return rows;
      }

      // Cell text is always inserted as text (never HTML); bare URLs become links
      function fill(el, value) {
        var v = value.trim();
        if (/^https?:\/\/\S+$/i.test(v)) {
          var a = document.createElement('a');
          a.href = v; a.textContent = v; a.target = '_blank'; a.rel = 'noopener noreferrer';
          el.appendChild(a);
        } else {
          el.textContent = v;
        }
      }

      function render(rows) {
        // Drop fully empty rows and trailing empty columns
        rows = rows.filter(function (r) { return r.some(function (c) { return c.trim() !== ''; }); });
        if (!rows.length) throw new Error('empty');
        var width = 0;
        rows.forEach(function (r) {
          for (var i = r.length - 1; i >= 0; i--) if (r[i].trim() !== '') { width = Math.max(width, i + 1); break; }
        });
        rows = rows.map(function (r) { var out = r.slice(0, width); while (out.length < width) out.push(''); return out; });

        var head = rows[0], body = rows.slice(1);
        var table = document.createElement('table');
        table.className = 'sheet';
        var thead = table.createTHead().insertRow();
        head.forEach(function (h) { var th = document.createElement('th'); th.textContent = h.trim(); thead.appendChild(th); });
        var tbody = table.createTBody();
        body.forEach(function (r) {
          var tr = tbody.insertRow();
          r.forEach(function (c) { fill(tr.insertCell(), c); });
        });

        var cards = document.createElement('div');
        cards.className = 'sheet-cards';
        body.forEach(function (r) {
          var card = document.createElement('div');
          card.className = 'sheet-card';
          r.forEach(function (c, i) {
            if (c.trim() === '') return;
            var f = document.createElement('div'); f.className = 'sheet-field';
            if (head[i] && head[i].trim()) {
              var l = document.createElement('div'); l.className = 'sheet-label'; l.textContent = head[i].trim();
              f.appendChild(l);
            }
            var v = document.createElement('div'); v.className = 'sheet-value'; fill(v, c);
            f.appendChild(v);
            card.appendChild(f);
          });
          if (card.children.length) cards.appendChild(card);
        });

        box.innerHTML = '';
        box.appendChild(table);
        box.appendChild(cards);
      }

      fetch(CSV_URL, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (t) { render(parseCSV(t)); })
        .catch(function () {
          box.innerHTML = '<p class="sheet-status">The spreadsheet could not be loaded here. Use the button below to open it in Google Sheets.</p>';
        });
    })();
  </script>
</body>
</html>
